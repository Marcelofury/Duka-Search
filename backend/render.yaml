# Render Blueprint for DukaSearch Backend
# Deploy with: `render blueprint deploy render.yaml`
# Docs: https://render.com/docs/blueprint-spec

services:
  # Typesense search engine (runs as a managed service on Render)
  - type: web
    name: dukasearch-typesense
    runtime: docker
    image: typesense/typesense:latest
    region: oregon
    plan: free
    envVars:
      - key: TYPESENSE_API_KEY
        value: xyz_admin_secret_key_dukasearch
    healthCheckPath: /health
    autoDeploy: true

  # Backend API server
  - type: web
    name: dukasearch-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: CORS_ORIGIN
        value: "*"
      - key: FIREBASE_PROJECT_ID
        value: duka-search
      - key: REQUIRE_AUTH
        value: "false"
      # Typesense points to the internal dukasearch-typesense service
      - key: TYPESENSE_HOST
        value: dukasearch-typesense
      - key: TYPESENSE_PORT
        value: "8108"
      - key: TYPESENSE_PROTOCOL
        value: http
      - key: TYPESENSE_ADMIN_API_KEY
        value: xyz_admin_secret_key_dukasearch
      - key: TYPESENSE_SEARCH_ONLY_API_KEY
        value: xyz_search_only_key_dukasearch
      # ⚠️ Set these manually in Render dashboard for security:
      # - FIREBASE_SERVICE_ACCOUNT_JSON (inline JSON) or FIREBASE_SERVICE_ACCOUNT_PATH
    buildCommand: npm ci --only=production
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - dukasearch-backend.onrender.com